name: CPU reproduction

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression and portable-archive tests
        run: python -m unittest discover -s tests -v
      - name: Refit every source readout and reconstruct main results
        run: python reproduce.py --refit --output results_ci
